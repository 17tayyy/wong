{{define "crumbs"}}{{icon "waypoints"}}<span>Graph</span>{{end}}
{{define "scripts"}}<script src="{{asset "graph.js"}}" defer></script>{{end}}
{{define "main"}}
<div class="graph-page">
  <h1 class="sr">Graph</h1>
  <div class="graph-bar" role="group" aria-label="Filter the graph">
    <label class="sr" for="g-shelf">Shelf</label>
    <select id="g-shelf" data-filter="s"><option value="">All shelves</option>{{range .Folders}}<option>{{.}}</option>{{end}}</select>
    <label class="sr" for="g-kind">Kind</label>
    <select id="g-kind" data-filter="k"><option value="">All kinds</option>{{range .KindNames}}<option>{{.}}</option>{{end}}</select>
    {{with .TagNames}}<label class="sr" for="g-tag">Tag</label>
    <select id="g-tag" data-filter="t"><option value="">All tags</option>{{range .}}<option value="{{.}}">#{{.}}</option>{{end}}</select>{{end}}
    <label class="toggle"><input type="checkbox" id="g-orphans" checked> Notes without links</label>
    <span class="graph-find">{{icon "search"}}<label class="sr" for="g-find">Find a note</label><input id="g-find" type="search" placeholder="Find a note" autocomplete="off"></span>
    <span class="graph-count" aria-live="polite">{{.GraphNotes}} notes · {{.GraphLinks}} links</span>
  </div>
  <canvas class="graph" data-graph="{{.Graph}}" tabindex="0" role="img" aria-label="Graph of {{.GraphNotes}} notes and {{.GraphLinks}} links between them. The library lists the same notes."></canvas>
  <noscript><p class="empty">The graph needs JavaScript. The <a href="/">library</a> lists the same notes.</p></noscript>
</div>
{{end}}

{{define "main"}}
<form class="login" method="post" action="/login">
  <span class="logo big" aria-hidden="true">w</span>
  <h1>Sign in to wong</h1>
  <p class="desc">Use any token this server issued. To make one for this browser, run on the server <code class="chip">wong serve --new-token browser</code>. It stays in a cookie on this browser only.</p>
  {{with .Error}}<div class="callout red" role="alert">{{icon "triangle-alert"}}<p>{{.}}</p></div>{{end}}
  <input type="hidden" name="next" value="{{.Next}}">
  <label for="token">Token</label>
  <input id="token" name="token" type="password" autocomplete="current-password" required autofocus placeholder="wong_…">
  <button class="btn primary" type="submit">Continue</button>
</form>
{{end}}
